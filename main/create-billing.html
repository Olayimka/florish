<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Details | Flourish Poppies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#fffaf5] text-gray-800">
  <nav class="bg-white/95 shadow-sm sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <img src="assest/logo.png" alt="Flourish Poppies logo" loading="eager" class="h-14 w-14 rounded-full object-contain border border-amber-200 bg-white p-1 shadow-sm" style="transform:translateZ(0); image-rendering:auto;">
        <div>
          <h2 class="heading text-lg sm:text-2xl font-bold text-blue-900 truncate">Flourish Poppies</h2>
        </div>
      </div>

      <ul class="hidden md:flex gap-8 text-gray-700 font-medium">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="consultation.html">Consultation</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <div class="flex items-center gap-3">
        <button id="menuBtn" class="md:hidden inline-flex h-11 w-11 items-center justify-center rounded-xl border border-blue-100 bg-blue-50 text-blue-900 text-xl shadow-sm" aria-label="Open menu" aria-expanded="false">☰</button>
        <a href="shop.html" class="hidden sm:inline-flex bg-blue-800 text-white px-5 py-3 rounded-xl hover:bg-blue-900 transition shadow-sm">Shop Now</a>
      </div>
    </div>

    <div id="mobileMenu" class="md:hidden hidden bg-white/95 backdrop-blur-xl shadow-2xl border-t border-pink-100">
      <div class="px-5 py-5">
        <div class="space-y-2">
          <a href="index.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">Home</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
          <a href="about.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">About Us</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
          <a href="gallery.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">Gallery</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
          <a href="consultation.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">Consultation</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
          <a href="contact.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">Contact Us</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
        </div>
        <div class="my-5 border-t border-pink-100"></div>
        <a href="shop.html" class="block text-center py-4 rounded-2xl font-semibold text-white bg-[#694929] from-blue-800 via-blue-700 to-blue-900 shadow-xl hover:shadow-blue-300/40 hover:-translate-y-1 transition-all duration-300">
          Shop Now →
        </a>
      </div>
    </div>
  </nav>

  <main class="py-16">
    <div class="max-w-2xl mx-auto rounded-3xl bg-white p-8 shadow-xl">
      <p class="text-xs uppercase tracking-[0.35em] text-blue-800">Checkout</p>
      <h1 class="heading text-3xl font-bold text-blue-950 mt-3">Billing Details</h1>
      <p class="mt-3 text-gray-600">Add your delivery information to continue to payment.</p>

      <form id="billingForm" class="mt-8 space-y-4">
        <input id="name" type="text" placeholder="Full Name" required class="w-full rounded-2xl border border-gray-200 p-3 focus:outline-none focus:ring-2 focus:ring-blue-200" />
        <input id="email" type="email" placeholder="Email" required class="w-full rounded-2xl border border-gray-200 p-3 focus:outline-none focus:ring-2 focus:ring-blue-200" />
        <input id="phone" type="tel" placeholder="Phone Number" required class="w-full rounded-2xl border border-gray-200 p-3 focus:outline-none focus:ring-2 focus:ring-blue-200" />
        <textarea id="address" rows="4" placeholder="Address" required class="w-full rounded-2xl border border-gray-200 p-3 focus:outline-none focus:ring-2 focus:ring-blue-200"></textarea>
        <button class="w-full rounded-2xl bg-blue-800 px-5 py-3 font-semibold text-white hover:bg-blue-900">Continue to payment</button>
      </form>
    </div>
  </main>

  <script>
    const verifiedEmail = localStorage.getItem('verifiedEmail');
    if (verifiedEmail) {
      document.getElementById('email').value = verifiedEmail;
    }

    document.getElementById('billingForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const data = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim()
      };

      localStorage.setItem('billingInfo', JSON.stringify(data));
      window.location.href = 'create-payemt.html';
    });
  </script>
</body>
</html>
