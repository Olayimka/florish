<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment | Flourish Poppies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#fffaf5] text-gray-800">
  <nav class="bg-white/95 shadow-sm sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <img src="assest/logo.png" alt="Flourish Poppies logo" loading="eager" class="h-14 w-14 rounded-full object-contain border border-amber-200 bg-white p-1 shadow-sm" style="transform:translateZ(0); image-rendering:auto;">
        <div>
          <h2 class="heading text-lg sm:text-2xl font-bold text-blue-900 truncate">Flourish Poppies</h2>
        </div>
      </div>

      <ul class="hidden md:flex gap-8 text-gray-700 font-medium">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="consultation.html">Consultation</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <div class="flex items-center gap-3">
        <button id="menuBtn" class="md:hidden inline-flex h-11 w-11 items-center justify-center rounded-xl border border-blue-100 bg-blue-50 text-blue-900 text-xl shadow-sm" aria-label="Open menu" aria-expanded="false">☰</button>
        <a href="shop.html" class="hidden sm:inline-flex bg-blue-800 text-white px-5 py-3 rounded-xl hover:bg-blue-900 transition shadow-sm">Shop Now</a>
      </div>
    </div>

    <div id="mobileMenu" class="md:hidden hidden bg-white/95 backdrop-blur-xl shadow-2xl border-t border-pink-100">
      <div class="px-5 py-5">
        <div class="space-y-2">
          <a href="index.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">Home</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
          <a href="about.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">About Us</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
          <a href="gallery.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">Gallery</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
          <a href="consultation.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">Consultation</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
          <a href="contact.html" class="group flex items-center justify-between rounded-2xl px-4 py-4 bg-[#fffaf5] hover:bg-pink-50 transition-all duration-300">
            <span class="font-medium text-gray-700">Contact Us</span>
            <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition">✦</span>
          </a>
        </div>
        <div class="my-5 border-t border-pink-100"></div>
        <a href="shop.html" class="block text-center py-4 rounded-2xl font-semibold text-white bg-[#694929] from-blue-800 via-blue-700 to-blue-900 shadow-xl hover:shadow-blue-300/40 hover:-translate-y-1 transition-all duration-300">
          Shop Now →
        </a>
      </div>
    </div>
  </nav>

  <main class="flex min-h-[70vh] items-center justify-center px-4 py-16">
    <div class="w-full max-w-xl rounded-3xl bg-white p-8 text-center shadow-xl">
      <p class="text-xs uppercase tracking-[0.35em] text-blue-800">Checkout</p>
      <h1 class="heading text-3xl font-bold text-blue-950 mt-3">Complete Payment</h1>
      <p class="mt-3 text-gray-600">Your order is almost ready. Confirm the payment to finish checkout.</p>
      <div id="paymentSummary" class="mt-8 rounded-2xl bg-blue-50 p-5 text-left"></div>
      <button id="payNow" class="mt-8 w-full rounded-2xl bg-green-600 px-5 py-3 font-semibold text-white hover:bg-green-700">Pay Now</button>
    </div>
  </main>

  <script>
    function parsePrice(value) {
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      if (!value) return 0;
      const cleaned = String(value).replace(/[^0-9.]/g, '');
      const parsed = parseFloat(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatPrice(value) {
      return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(parsePrice(value));
    }

    function formatCad(value) {
      return new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 2 }).format(parsePrice(value));
    }

    const urlParams = new URLSearchParams(window.location.search);
    const returnRef = urlParams.get('orderRef') || urlParams.get('reference');

    if (returnRef) {
      verifyReturnPayment(returnRef);
    } else {
      renderSummary();
    }

    function renderSummary() {
      const summary = document.getElementById('paymentSummary');
      const payBtn = document.getElementById('payNow');
      const cart = JSON.parse(localStorage.getItem('flourishCart') || '[]');
      const total = cart.reduce((sum, item) => sum + parsePrice(item.price) * Number(item.qty || 1), 0);
      const cadTotal = total / 1250;

      summary.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-xs uppercase tracking-widest font-semibold text-blue-800">Order Subtotal (NGN)</span>
          <span class="text-xl font-bold text-blue-900">${formatPrice(total)}</span>
        </div>
        <div class="flex items-center justify-between mt-2 pt-2 border-t border-blue-100">
          <span class="text-xs uppercase tracking-widest font-semibold text-amber-800">Approx. CAD Equivalent</span>
          <span class="text-base font-semibold text-amber-700">${formatCad(cadTotal)} CAD</span>
        </div>
        <p class="mt-3 text-xs text-gray-500">${cart.length ? `${cart.length} item${cart.length > 1 ? 's' : ''} in cart` : 'Cart is empty'}</p>
      `;

      if (payBtn) {
        payBtn.innerHTML = `Pay ${formatPrice(total)} (${formatCad(cadTotal)} CAD) →`;
      }

      payBtn.addEventListener('click', payNow);
    }

    async function payNow() {
      const payBtn = document.getElementById('payNow');
      const billing = JSON.parse(localStorage.getItem('billingInfo') || '{}');
      const verifiedEmail = localStorage.getItem('verifiedEmail') || billing.email;
      const cart = JSON.parse(localStorage.getItem('flourishCart') || '[]');

      if (!verifiedEmail) {
        alert('Please verify your email address before proceeding to payment.');
        window.location.href = 'checkout-email.html';
        return;
      }

      if (!cart.length) {
        alert('Your cart is empty.');
        window.location.href = 'shop.html';
        return;
      }

      payBtn.disabled = true;
      payBtn.innerText = 'Connecting to Paystack...';

      try {
        const res = await fetch('/api/payment/initialize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: verifiedEmail,
            cart,
            billingDetails: billing
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Payment initialization failed');

        if (data.authorizationUrl) {
          // Redirect to Paystack Checkout page
          window.location.href = data.authorizationUrl;
        } else {
          throw new Error('Could not obtain Paystack authorization link.');
        }
      } catch (err) {
        alert(err.message || 'Payment initialization error');
        payBtn.disabled = false;
        payBtn.innerText = 'Pay Now';
      }
    }

    async function verifyReturnPayment(reference) {
      const container = document.querySelector('main > div');
      container.innerHTML = `
        <div class="py-12 text-center">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-800 border-t-transparent mb-4"></div>
          <h2 class="text-2xl font-bold text-blue-950">Verifying Payment...</h2>
          <p class="text-gray-600 mt-2">Please wait while we confirm your order with Paystack.</p>
        </div>
      `;

      try {
        const res = await fetch(`/api/payment/verify?reference=${encodeURIComponent(reference)}`);
        const data = await res.json();

        if (res.ok && data.status === 'PAID') {
          // Clear cart
          localStorage.removeItem('flourishCart');

          container.innerHTML = `
            <div class="py-6 text-center">
              <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-green-600 mb-4 text-3xl">✓</div>
              <h1 class="heading text-3xl font-bold text-blue-950">Payment Successful!</h1>
              <p class="mt-3 text-gray-600">Your order <strong>${reference}</strong> has been confirmed.</p>
              <div class="mt-6 rounded-2xl bg-green-50 p-4 text-left border border-green-200">
                <p class="text-sm font-semibold text-green-900">📬 Email Receipt Dispatched</p>
                <p class="text-xs text-green-700 mt-1">A detailed receipt has been sent to your email. Our team has also been notified to prepare your delivery.</p>
              </div>
              <a href="shop.html" class="mt-8 inline-block rounded-2xl bg-blue-800 px-6 py-3 text-white font-semibold hover:bg-blue-900">Return to Shop</a>
            </div>
          `;
        } else {
          throw new Error('Payment verification unconfirmed');
        }
      } catch (err) {
        container.innerHTML = `
          <div class="py-6 text-center">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-100 text-red-600 mb-4 text-3xl">✕</div>
            <h1 class="heading text-3xl font-bold text-red-950">Payment Verification Failed</h1>
            <p class="mt-3 text-gray-600">${err.message || 'We could not verify this transaction.'}</p>
            <a href="create-payemt.html" class="mt-8 inline-block rounded-2xl bg-blue-800 px-6 py-3 text-white font-semibold">Try Again</a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
